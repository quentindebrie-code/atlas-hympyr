# Configuration de l'Atlas territorial Hympyr.
# Tout ce qui est marqué « À RENSEIGNER » doit être complété avant de construire les données réelles
# (python -m atlas_hympyr.etl.build). L'application fonctionne sans cela en mode démonstration.

perimetre:
  # Zone desservie : 7 départements (codes INSEE)
  departements: ["09", "11", "31", "32", "65", "81", "82"]

# Dépôts de départ des tournées (coordonnées WGS84). À RENSEIGNER avec les dépôts réels.
# Exemple (à ne pas laisser tel quel) :
#   - {id: "depot-1", nom: "Dépôt principal", lat: 0.0, lon: 0.0}
depots: []

routage:
  # "estimation" : distance à vol d'oiseau x coefficient de détour (hors ligne, approximatif)
  # "osrm"       : serveur OSRM auto-hébergé sur extrait OpenStreetMap (recommandé en réel)
  fournisseur: estimation
  estimation:
    vitesse_moyenne_kmh: 55      # à calibrer sur les temps de tournée observés
    coef_detour: 1.30            # rapport distance routière / vol d'oiseau, à calibrer
  osrm:
    url: "http://localhost:5000"
    profil: "driving"
    timeout_s: 20
  # Multiplicateur appliqué aux durées pour tenir compte des poids lourds (profil voiture sinon)
  coef_temps_poids_lourd: 1.0    # À CALIBRER avec le responsable exploitation
  # Raster d'altitude (GeoTIFF) pour dénivelé et altitude : RGE ALTI, BD ALTI ou équivalent ouvert
  mnt_geotiff: null

scoring:
  # Poids des composantes de la difficulté d'accès (renormalisés si une composante est absente)
  poids_difficulte:
    temps: 0.35
    sinuosite: 0.20
    altitude: 0.15
    denivele: 0.20
    trafic: 0.10
  # Poids de la priorité de ciblage (réglables dans l'application)
  poids_priorite:
    potentiel: 0.50
    densite: 0.20
    facilite: 0.30

# Produits : indicateur = colonne de la table des communes utilisée comme proxy de la demande
produits:
  fioul:
    libelle: "Fioul domestique"
    segment: "Particuliers"
    indicateur: rp_fioul
    unite: "résidences principales chauffées au fioul"
  granules:
    libelle: "Granulés de bois"
    segment: "Particuliers"
    indicateur: rp_autre
    unite: "résidences principales chauffées avec un combustible « autre » (bois, charbon…)"
    fiabilite: faible
    avertissement: >-
      Proxy faible : l'Insee ne publie pas de variable « bois » par commune. « Autre combustible »
      regroupe bois (bûches comprises), charbon et divers. À valider avec les ventes de granulés
      avant tout usage décisionnel.
  gnr:
    libelle: "GNR"
    segment: "Entreprises et collectivités"
    indicateur: surf_agri_ha
    unite: "hectares agricoles déclarés"
  gasoil_routier:
    libelle: "Gasoil routier"
    segment: "Entreprises et collectivités"
    indicateur: pl_entreprises
    unite: "poids lourds d'entreprises"
  adblue:
    libelle: "AdBlue"
    segment: "Entreprises et collectivités"
    indicateur: pl_diesel_recents
    unite: "poids lourds diesel récents"

sources:
  # Recensement Insee (résidences principales par combustible de chauffage), fichier communal.
  # Téléchargement : python -m atlas_hympyr.etl.telecharger
  # Colonnes vérifiées dans la documentation Insee (base-cc-logement-2022) ; le fichier réel n'a
  # pas pu être ouvert depuis l'environnement de développement : l'en-tête est contrôlé à la lecture.
  insee_logement:
    fichier: data/raw/insee_logement.csv
    url: "https://www.insee.fr/fr/statistiques/fichier/8581474/base-cc-logement-2022_csv.zip"
    separateur: ";"
    millesime: "2022"
    colonnes:
      code: CODGEO
      rp_total: P22_RP
      rp_fioul: P22_RP_CFIOUL
      rp_autre: P22_RP_CAUT

  # Altitude des communes (data.gouv.fr, « Liste des communes de France 2026 », Licence Ouverte v2) :
  # colonnes code_insee, altitude_moyenne, altitude_minimale, altitude_maximale (vérifiées).
  # Sert d'altitude de repli quand aucun MNT n'est configuré.
  altitude:
    fichier: data/raw/communes_france.csv
    url: "https://static.data.gouv.fr/resources/communes-et-villes-de-france-en-csv-excel-json-parquet-et-feather/20260617-155950/communes-france-2026.csv"
    separateur: ","
    colonnes:
      code: code_insee
      altitude: altitude_moyenne

  # SDES, parc de véhicules routiers (export communal DiDo, CSV, séparateur « ; »).
  # En-tête et valeurs relevés sur le fichier réel le 08/10/2026 (format « large » : une colonne
  # PARC_<année> par année, donc pas de filtre d'année : on choisit la colonne).
  # PARC_2024 = dernier millésime définitif pour les poids lourds (2025 et 2026 : provisoires).
  # Les rangs changent peu d'une année à l'autre ; pour un millésime plus récent, changer `nombre`.
  sdes_parc:
    fichier: data/raw/sdes_parc.csv
    url: "https://data.statistiques.developpement-durable.gouv.fr/dido/api/v1/datafiles/1582861b-e042-4490-9161-6429d8229703/csv"
    separateur: ";"
    millesime: "2024-01-01"
    annee_colonne: null
    annee_valeur: null
    colonnes:
      code: COMMUNE_CODE
      nombre: PARC_2024
      genre: GROUPE               # valeurs : PL, TCP, VP, VUL
      energie: CARBURANT          # Diesel, Diesel HNR, Diesel HR, Essence, Electrique, Gaz...
      utilisateur: STATUT_UTILISATEUR   # Particulier, Professionel (une seule lettre n, comme dans le fichier)
      crit_air: CRIT_AIR          # Crit'Air 1 ... 5, Crit'Air E, Inconnu, Non classé
    filtres:
      # Gasoil routier : poids lourds diesel détenus par des professionnels.
      pl_entreprises:
        genre: ["PL"]
        energie: ["Diesel", "Diesel HNR", "Diesel HR"]
        utilisateur: ["Professionel"]
      # AdBlue : poids lourds diesel professionnels Crit'Air 2 et 3.
      # HYPOTHÈSE (pratique de place, non vérifiée ici) : pour un poids lourd diesel, Crit'Air 2 ~ Euro VI
      # et Crit'Air 3 ~ Euro IV/V, normes où la dépollution SCR (AdBlue) est la solution dominante.
      # À faire confirmer par l'exploitation ou un revendeur de véhicules.
      pl_diesel_recents:
        genre: ["PL"]
        energie: ["Diesel", "Diesel HNR", "Diesel HR"]
        utilisateur: ["Professionel"]
        crit_air: ["Crit'Air 2", "Crit'Air 3"]

  # Registre parcellaire graphique (IGN), parcelles ou îlots, GeoPackage/Shapefile
  rpg:
    fichier: data/raw/rpg.gpkg
    couche: null
    crs_defaut: 2154             # utilisé uniquement si le fichier n'a pas de CRS déclaré
    colonne_groupe_culture: null # optionnel
    groupes_exclus: []           # optionnel : groupes de cultures à ne pas compter

  # Trafic (optionnel) : CSV code;tmja produit par vos soins à partir des cartes DREAL
  trafic:
    fichier: data/raw/trafic_communes.csv

geo:
  api_communes: "https://geo.api.gouv.fr/departements/{dep}/communes"
  simplification_deg: 0.0005     # simplification des contours pour l'affichage web
