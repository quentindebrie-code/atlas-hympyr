[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-hympyr"
version = "0.1.0"
description = "Atlas territorial Hympyr Energies : potentiel commercial et difficulté d'accès par commune (open data)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "pandas>=2.2",
    "numpy>=1.26",
    "plotly>=5.24",
    "pyarrow>=15",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Uniquement pour reconstruire les données réelles (pas nécessaire pour lancer l'application)
etl = [
    "requests>=2.31",
    "shapely>=2.0",
    "geopandas>=1.0",
    "pyogrio>=0.7",
    "rasterio>=1.3",
]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
